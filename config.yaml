# ==========================================
# ABI Coach - Archivo de Configuración
# ==========================================

gemini:
  # Modelo ultra rápido para visión y análisis con cero saturación
  model: "gemini-3.1-flash-lite-preview"
  # Opciones: high, medium, low (en Gemini 3 / 2.5 regula la resolución interna de imagen)
  media_resolution: "high"
  temperature: 0.3

capture:
  # Monitor del juego (1 = DISPLAY1 2560x1440 primario)
  monitor_index: 1
  # Resolución de salida para la captura completa (Lanczos downscale)
  downscale_width: 1920
  downscale_height: 1080
  jpeg_quality: 85
  # Guardar copia en disco de las capturas para depuración
  save_captures: false
  capture_dir: "captures"
  # Regiones de interés a resolución nativa 1440p (opcional, recortadas sin pérdida)
  regions:
    # alijo:
    #   x: 1420
    #   y: 120
    #   width: 1100
    #   height: 1200
    # mercado:
    #   x: 350
    #   y: 180
    #   width: 1860
    #   height: 1050

listener:
  # Modo de escucha:
  #   "continuous" = Manos libres (VAD): Habla naturalmente, detecta tu voz y responde sin tocar teclas.
  #   "ptt" = Push-to-Talk exclusivo (mantener tecla para hablar).
  #   "hybrid" = Escucha continua por voz y además responde a la tecla F9.
  mode: "continuous"

  # Tecla para Push-to-Talk (activa si usas modo ptt o hybrid)
  ptt_key: "f9"
  mouse_button_enabled: false
  mouse_button: "x2"

  sample_rate: 16000
  # Umbral de detección de voz (RMS): 0.010 a 0.020 (adecuado para Corsair Virtuoso)
  vad_threshold: 0.012
  # Segundos de silencio para considerar que terminaste de formular tu pregunta
  silence_duration_sec: 1.0
  # Duración mínima de voz (ignora carraspeos o ruidos < 0.4s)
  min_duration_sec: 0.4

  # Palabra de activación opcional (déjalo comentado o vacío para que responda a cualquier pregunta directa)
  # wake_word: "coach"

  whisper_model: "large-v3-turbo"
  whisper_device: "cuda"
  whisper_compute_type: "float16"
  language: "es"

speaker:
  engine: "edge-tts"
  # Catálogo de voces femeninas naturales (menos robóticas):
  #   "es-CO-SalomeNeural"  -> Salomé (Colombia): Tono cálido, dulce, muy humano y fluido (RECOMENDADA)
  #   "es-ES-ElviraNeural"  -> Elvira (España): Expresiva, natural y excelente prosodia
  #   "es-ES-XimenaNeural"  -> Ximena (España): Tono joven, moderno y dinámico
  #   "es-PE-CamilaNeural"  -> Camila (Perú): Suave, pausada, amigable y clara
  #   "es-US-PalomaNeural"  -> Paloma (EE.UU. / Neutro): Neutra, ágil y conversacional
  #   "es-MX-DaliaNeural"   -> Dalia (México): Profesional y formal
  voice: "es-CO-SalomeNeural"
  rate: "+0%"
  volume: "+0%"
  pitch: "+0Hz"

reports:
  output_dir: "reports"
  # Abrir automáticamente el navegador con la tabla/gráfica interactiva
  auto_open_browser: true
  # Navegador preferido para visualizar reportes en DISPLAY2:
  #   "firefox" -> Mozilla Firefox (Recomendado: ultraligero, sin extensiones pesadas, rápido)
  #   "edge"    -> Microsoft Edge (Nativo de Windows 11)
  #   "chrome"  -> Google Chrome
  preferred_browser: "firefox"


history:
  # Cantidad máxima de turnos anteriores en memoria de texto
  max_turns: 5
