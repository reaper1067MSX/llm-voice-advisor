[project]
name = "abi-coach"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Santiago Arguello", email = "geovanny1067@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dxcam>=0.3.0",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.30.1",
    "miniaudio>=1.71",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.4",
    "pyttsx3>=2.99",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
]

[project.scripts]
abi-coach = "abi_coach:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
