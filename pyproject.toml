[project]
name = "llm-voice-advisor"
version = "0.2.3"
description = "Real-time Multimodal AI Gaming Voice Advisor & Tactical Co-pilot with VAD, local GPU Whisper STT, Natural TTS, Smart Visual Inference, and dynamic secondary-monitor dashboards."
authors = [
    { name = "Santiago Arguello", email = "geovanny1067@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dxcam>=0.3.0",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.30.1",
    "miniaudio>=1.71",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyttsx3>=2.99",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "windows-capture>=2.0.1",
]

[project.scripts]
game-advisor = "abi_coach.presentation.cli:main"
llm-voice-advisor = "abi_coach.presentation.cli:main"
abi-coach = "abi_coach.presentation.cli:main"


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "abi_coach"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that touch real infrastructure (disk, network, GPU, OS APIs)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S110", "BLE001"]

[tool.importlinter]
root_package = "abi_coach"

[[tool.importlinter.contracts]]
name = "Capas de Clean Architecture"
type = "layers"
layers = [
    "abi_coach.presentation",
    "abi_coach.infrastructure",
    "abi_coach.application",
    "abi_coach.domain",
]
# Excepciones históricas de instanciación por defecto (a eliminar en Etapas 4-5):
ignore_imports = [
    "abi_coach.application.orchestration.advisor_orchestrator -> abi_coach.infrastructure.adapters.llm.factory",
    "abi_coach.application.orchestration.advisor_orchestrator -> abi_coach.infrastructure.adapters.storage.db",
    "abi_coach.application.orchestration.advisor_orchestrator -> abi_coach.infrastructure.adapters.storage.in_memory_blackboard",
    "abi_coach.application.orchestration.advisor_orchestrator -> abi_coach.infrastructure.config.settings",
    "abi_coach.application.pipeline.exception_middleware -> abi_coach.infrastructure.adapters.logging.structured_logger",
    "abi_coach.application.services.config_mutator -> abi_coach.infrastructure.config.settings",
    "abi_coach.application.slices.archetypes.manager -> abi_coach.infrastructure.adapters.storage.sqlite_archetype_repository",
    "abi_coach.application.slices.archetypes.scaffolder -> abi_coach.infrastructure.adapters.storage.db",
    "abi_coach.application.slices.companion_memory.memory -> abi_coach.infrastructure.adapters.storage.db",
    "abi_coach.application.slices.metatuning.engine -> abi_coach.infrastructure.adapters.storage.db",
    "abi_coach.application.slices.metatuning.engine -> abi_coach.infrastructure.config.settings",
    "abi_coach.application.slices.reporting.dashboard -> abi_coach.infrastructure.adapters.platform.browser_launcher",
    "abi_coach.application.slices.reporting.dashboard -> abi_coach.infrastructure.presentation.dashboard_presenter",
    "abi_coach.application.slices.reporting.reports -> abi_coach.infrastructure.adapters.platform.browser_launcher",
    "abi_coach.application.slices.reporting.reports -> abi_coach.infrastructure.adapters.platform.win32_window_manager",
    "abi_coach.application.slices.tactical_rag.rag -> abi_coach.infrastructure.adapters.storage.cache",
    "abi_coach.application.slices.tactical_rag.rag -> abi_coach.infrastructure.adapters.storage.db",
    "abi_coach.application.slices.tactical_rag.reconciler -> abi_coach.infrastructure.adapters.storage.db",
]
