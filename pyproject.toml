[project]
name = "llm-voice-advisor"
version = "0.1.0"
description = "Real-time Multimodal AI Gaming Voice Advisor & Tactical Co-pilot with VAD, local GPU Whisper STT, Natural TTS, Smart Visual Inference, and dynamic secondary-monitor dashboards."
authors = [
    { name = "Santiago Arguello", email = "geovanny1067@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.30.1",
    "miniaudio>=1.71",
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyttsx3>=2.99",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
]

[project.scripts]
game-advisor = "abi_coach.main:main"
llm-voice-advisor = "abi_coach.main:main"
abi-coach = "abi_coach.main:main"


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "abi_coach"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

